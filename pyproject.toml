[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pop909-conditional-piano"
version = "0.1.0"
description = "Reproducible POP909 piano generation conditioned on melody, key, and chord progression."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "miditoolkit>=1.0.1,<2",
  "torch>=2.6",
  "transformers>=5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
